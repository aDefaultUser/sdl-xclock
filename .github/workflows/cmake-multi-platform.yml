name: CMake on Alpine Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        apk update
        apk add --no-cache \
          cmake \
          gcc \
          make \
          musl-dev \
          linux-headers \
          git \
          build-base \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxrender-dev \
          libxfixes-dev \
          libxkbcommon-dev \
          wayland-dev

    - name: Build and install SDL3 from source
      run: |
        git clone --depth 1 --branch SDL3 https://github.com/libsdl-org/SDL.git
        cd SDL
        ./configure --prefix=/usr
        make -j$(nproc)
        make install
        cd ..
        rm -rf SDL

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -S .

    - name: Build
      run: cmake --build build --config Release --parallel $(nproc)

    - name: Run (optional smoke test)
      run: |
        # Just verify the binary exists and can start (headless? might need a dummy display)
        # For a simple test, check that the binary is executable.
        test -x build/sdl-xclock
