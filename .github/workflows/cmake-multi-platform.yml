name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        # Only use compilers that are guaranteed to work out-of-the-box
        include:
          - os: ubuntu-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: cl          # MSVC (via vcpkg + VS environment)

    steps:
    - uses: actions/checkout@v4

    # ---------- Linux: install SDL3 from source ----------
    - name: Install SDL3 (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwayland-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev libxkbcommon-dev
        git clone --depth 1 --branch SDL3 https://github.com/libsdl-org/SDL.git
        cd SDL
        ./configure --prefix=/usr
        make -j$(nproc)
        sudo make install
        cd ..
        sudo ldconfig

    # ---------- Windows: install SDL3 via vcpkg ----------
    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 38dd44a56a269c75794a8268a679f87ff01bf47e   # Update as needed

    - name: Install SDL3 via vcpkg (Windows)
      if: runner.os == 'Windows'
      run: vcpkg install sdl3:x64-windows
      shell: cmd

    # ---------- Common configuration ----------
    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B ${{ steps.strings.outputs.build-output-dir }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }} \
          -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    # (Optional) No tests yet – remove or add if you implement ctest
    - name: Test
      if: false   # skip until tests are added
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}
